<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>שרטוט</title>
<style>
@font-face{font-family:Heebo;src:url("../public/fonts/heebo-hebrew-700.woff2") format("woff2");font-weight:700;unicode-range:U+0590-05FF}
body{margin:0;min-height:900px;width:1440px;padding:48px;color:#1A2637;font-family:Heebo,Arial,sans-serif;
 background-color:#F7F5F0;
 background-image:linear-gradient(to right, rgba(32,63,96,.12) 1px, transparent 1px), linear-gradient(to bottom, rgba(32,63,96,.12) 1px, transparent 1px);
 background-size:24px 24px}
h1{margin:0 0 12px;font-size:28px;font-weight:800}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sw{width:140px;height:88px;border:1px solid rgba(32,63,96,.35);padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:12px;font-weight:700;background:rgba(255,255,255,.8)}
button{min-height:36px;border:1px solid #1A2637;background:transparent;color:#1A2637;padding:8px 14px;font:inherit;font-weight:700}
.primary{background:#1A2637;color:#F7F5F0}
.chip{border:1px solid rgba(32,63,96,.35);padding:3px 8px;font-size:12px;font-weight:700}
img{width:240px;background:#fff;border:1px solid rgba(32,63,96,.35);padding:8px}
</style>
</head>
<body>
<img src="../public/brand/tene-pdf-logo.jpg" alt="טנא">
<h1>שרטוט</h1>
<p style="font-size:14px;max-width:640px">נייר, רשת קווים, וצבעי הלוגו רק בקו, בכפתור ובמצב. ספרות טבלה. פינות ישרות כמו גיליון.</p>
<div class="row">
  <div class="sw"><b dir="ltr">#F7F5F0</b>נייר</div>
  <div class="sw" style="background:#1A2637;color:#F7F5F0"><b dir="ltr">#1A2637</b>קו</div>
  <div class="sw" style="background:#E07B39"><b dir="ltr">#E07B39</b>הדגשה</div>
  <div class="sw" style="background:#395974;color:#fff"><b dir="ltr">#395974</b>כחול</div>
  <div class="sw" style="background:#6D9F61"><b dir="ltr">#6D9F61</b>ירוק</div>
</div>
<div class="row" style="margin-top:18px">
  <button class="primary" type="button">שמור הזמנה</button>
  <button type="button">ביטול</button>
  <span class="chip" style="color:#A85C2B">בייצור</span>
  <span class="chip" style="color:#44633C">הושלם</span>
  <span class="chip" style="color:#395974">בתור</span>
</div>
</body>
</html>
