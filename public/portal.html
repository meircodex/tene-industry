<!DOCTYPE html>
<html lang="he" dir="rtl" data-tene-portal>
<head>
<script src="/user-messages.js?v=1"></script>
<meta charset="UTF-8">
<script data-portal-contrast-bootstrap>
  (() => {
    const key = 'tene-portal-contrast';
    const root = document.documentElement;
    const preference = window.matchMedia('(prefers-contrast: more)');
    let choice;
    try { choice = localStorage.getItem(key); } catch {}
    const apply = () => {
      const high = choice === 'high' || (choice !== 'normal' && preference.matches);
      root.dataset.portalContrast = high ? 'high' : 'normal';
      document.getElementById('portalContrastToggle')?.setAttribute('aria-pressed', String(high));
    };
    apply();
    preference.addEventListener('change', apply);
    document.addEventListener('DOMContentLoaded', () => {
      apply();
      document.getElementById('portalContrastToggle').addEventListener('click', () => {
        choice = root.dataset.portalContrast === 'high' ? 'normal' : 'high';
        try { localStorage.setItem(key, choice); } catch {}
        apply();
      });
    });
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>פורטל לקוח – IronBend</title>
<meta name="theme-color" content="#1C3C64">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/portal-customer.css">
</head>
<body class="portal-entry">
  <header class="portal-header">
    <div class="portal-header-inner">
    <div class="logo">
      <img class="logo-img" src="/brand/tene-pdf-logo.jpg" alt="טנא תעשיות ברזל">
      <span class="header-sub">פורטל לקוחות</span>
    </div>
    <button type="button" class="portal-contrast-toggle" id="portalContrastToggle" aria-label="ניגודיות: רגילה / גבוהה" aria-pressed="false">
  <span aria-hidden="true" class="portal-contrast-icon"></span><span>ניגודיות: <strong class="portal-contrast-normal">רגילה</strong> / <strong class="portal-contrast-high">גבוהה</strong></span>
</button>
    </div>
  </header>

  <main class="portal-entry-main">
    <section class="entry-card">
      <h1 class="entry-title">פורטל לקוח מאובטח</h1>
      <p class="entry-sub">
        הגישה לפורטל הלקוחות מתבצעת באמצעות קישור או קוד מאובטח.
      </p>
      <a class="btn-primary" href="/customer.html">כניסה לפורטל הלקוחות</a>
      <p class="entry-note">
        אם לא הגיע אליכם קישור מאובטח, פנו למוקד השיווק או לשירות לקוחות לקבלת גישה.
      </p>
    </section>
  </main>
</body>
</html>
