<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ערבויות לקוחות — טנא</title>
<script src="/auth-client.js"></script><script src="/nav.js" defer></script><link rel="stylesheet" href="/theme.css">
<style>body{font-family:Arial,sans-serif;background:#f0f4f8;color:#24344d;margin:0}main{max-width:1050px;margin:auto;padding:24px}.card{background:white;border:1px solid #dbe3ef;border-radius:14px;padding:18px;margin:12px 0}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select,input{font:inherit;padding:9px;border:1px solid #afbdcc;border-radius:8px;margin:5px}button{cursor:pointer;background:white}button:disabled{opacity:.5}small{color:#526070}#error{color:#b83227}a{color:#a54d13}</style></head>
<body><main><h1>מסמכי ערבויות לקוחות</h1><a href="/portal-requests.html">חזרה לבקשות לקוח</a><p>בדיקה ותיעוד מסמכים בלבד. החלטה כאן אינה מאשרת הזמנה לייצור.</p><label for="status">מצב</label><select id="status" onchange="load()"><option value="">הכול</option><option value="uploaded_pending_review">ממתינה לבדיקה</option><option value="approved">מאושרת</option><option value="rejected">נדחתה</option><option value="expired">פג תוקף</option><option value="revoked">בוטלה</option></select><button onclick="load()">רענן</button><p id="error" role="alert"></p><section id="list">טוען…</section></main>
<script>
const labels={uploaded_pending_review:'ממתינה לבדיקה',approved:'מאושרת',rejected:'נדחתה',expired:'פג תוקף',revoked:'בוטלה'},busy=new Set();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const q=document.getElementById('status').value;const r=await fetch('/api/portal/guarantees'+(q?'?status='+encodeURIComponent(q):''));const d=await r.json();if(!r.ok)throw Error(d.error||'אין הרשאה לצפות במסמכי הערבות');document.getElementById('error').textContent='';document.getElementById('list').innerHTML=d.documents.map(x=>`<article class="card"><div class="row"><b>${esc(x.original_name)}</b><span>${esc(labels[x.computed_status]||x.computed_status)}</span></div><small>לקוח #${x.customer_id} · הועלה ${esc(x.uploaded_at||'')} · תוקף ${esc(x.valid_until||'טרם נקבע')}</small><p>${esc(x.notes||'')}</p><button onclick="download(${x.id},this)">הורד מסמך</button>${d.canReview?`<div class="row"><label for="date-${x.id}">תוקף עד</label><input id="date-${x.id}" type="date" value="${esc(x.valid_until||'')}"><label for="note-${x.id}">נימוק / הערה</label><input id="note-${x.id}" maxlength="1000"><button onclick="review(${x.id},'approved',this)">אישור</button><button onclick="review(${x.id},'rejected',this)">דחייה</button><button onclick="review(${x.id},'revoked',this)">ביטול אישור</button></div>`:''}</article>`).join('')||'<p>אין מסמכים בתצוגה זו.</p>';}catch(e){document.getElementById('error').textContent=e.message;}}
async function download(id,button){button.disabled=true;try{const r=await fetch('/api/portal/guarantees/'+id+'/download');if(!r.ok)throw Error('הורדת המסמך נכשלה');const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;const name=r.headers.get('Content-Disposition')?.split("filename*=UTF-8''")[1];a.download=name?decodeURIComponent(name):'guarantee';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){document.getElementById('error').textContent=e.message;}finally{button.disabled=false;}}
async function review(id,status,button){if(busy.has(id)||!confirm('לשמור החלטה: '+labels[status]+'? הפעולה תירשם ביומן הבקרה.'))return;busy.add(id);button.disabled=true;try{const valid_until=document.getElementById('date-'+id).value||null,notes=document.getElementById('note-'+id).value;const r=await fetch('/api/portal/guarantees/'+id,{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({status,valid_until,notes})});const d=await r.json();if(!r.ok)throw Error(d.error||'ההחלטה לא נשמרה');await load();}catch(e){document.getElementById('error').textContent=e.message;}finally{busy.delete(id);button.disabled=false;}}
load();
</script></body></html>
